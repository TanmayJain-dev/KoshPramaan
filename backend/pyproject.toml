[project]
name = "koshpramaan-backend"
version = "0.1.0"
description = "AICTE Security Deposit and FDR Portal - कोष-प्रमाण"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "itsdangerous>=2.2.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.3.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

