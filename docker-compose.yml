services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/koshpramaan.db
      - JWT_SECRET=koshpramaan-sih-2026-secret-key-salt
      - ACCESS_TOKEN_EXPIRE_HOURS=24
    volumes:
      - koshpramaan-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  koshpramaan-data:

